<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para ti 💌</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Petals -->
  <div class="petals-container" id="petals"></div>

  <!-- Special date banner -->
  <div class="special-banner" id="specialBanner">
    <span class="special-icon" id="specialIcon"></span>
    <span class="special-text" id="specialText"></span>
  </div>

  <div class="lock-screen" id="lockScreen">
    <p class="lock-title">Acceso</p>
    <p class="lock-question">¿Qué nos dijimos antes de te quiero?</p>
    <input class="lock-input" id="lockInput" type="text" placeholder="escribe la respuesta..." autocomplete="off">
    <p class="lock-error" id="lockError"></p>
  </div>

  <!-- Main scene -->
  <div class="scene">
    <p class="subtitle">T'estime</p>
    <p class="contador-dias" id="contadorDias"></p>

    <div class="heart-wrapper" id="heartBtn" title="Toca el corazón">
      <div class="heart-glow"></div>
      <svg class="heart-svg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="hg" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#4ecb6e"/>
            <stop offset="100%" stop-color="#1a5c2e"/>
          </radialGradient>
          <filter id="inner-glow">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
          </filter>
        </defs>
        <path d="M50 85 C50 85 5 52 5 27 C5 12 16 3 28 3 C36 3 44 8 50 15 C56 8 64 3 72 3 C84 3 95 12 95 27 C95 52 50 85 50 85 Z"
              fill="url(#hg)" filter="url(#inner-glow)"/>
        <ellipse cx="34" cy="22" rx="9" ry="6" fill="rgba(255,255,255,0.15)" transform="rotate(-20 34 22)"/>
      </svg>
    </div>

    <p class="tap-hint">toca el corazón</p>

    <div class="message-area">
      <div class="message-box" id="msgBox">
        <p class="message-text" id="msgText"></p>
        <p class="message-author" id="msgAuthor"></p>
      </div>
    </div>

    <p class="counter" id="counter"></p>

    <button class="carta-btn" id="cartaBtn">✉ leer la carta</button>
    <button class="quiero-btn" id="quieroBtn">🌻</button>
  </div>

  <!-- Carta modal -->
  <div class="carta-overlay" id="cartaOverlay">
    <div class="carta-modal">
      <button class="carta-close" id="cartaClose">✕</button>
      <p class="carta-dear" id="cartaDear"></p>
      <div class="carta-body" id="cartaBody"></div>
      <p class="carta-firma" id="cartaFirma"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
